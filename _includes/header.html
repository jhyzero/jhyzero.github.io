<header class="site-header" data-header>
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
      <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
      <span>{{ site.title }}</span>
    </a>

    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-navigation" data-menu-button>
      <span class="sr-only">打开导航</span>
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" id="site-navigation" aria-label="主要导航" data-menu>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.url contains '/archives' %} aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>关于</a>
      <a href="{{ '/rss.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</header>
