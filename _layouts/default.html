<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f3">
    <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 150 | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS" href="{{ '/rss.xml' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/particles.js' | relative_url }}" defer></script>
  </head>
  <body class="{% if page.body_class %}{{ page.body_class }}{% endif %}">
    <a class="skip-link" href="#main-content">跳到正文</a>
    <canvas class="code-canvas" data-code-canvas aria-hidden="true"></canvas>
    {% include header.html %}
    <main id="main-content" class="page-shell">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
